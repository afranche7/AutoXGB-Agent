[project]
name = "autoxgb-agent"
version = "0.1.0"
description = "DeepAgents-powered ML bootstrapper: point it at a dataset and a plain-English goal, get a tuned XGBoost pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.2",
    "langchain-anthropic>=0.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "optuna>=4.0",
    "shap>=0.46",
    "matplotlib>=3.9",
    "typer>=0.12",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# The web UI is optional: the CLI shows the same progress without it.
ui = ["streamlit>=1.37"]

[project.scripts]
autoxgb = "autoxgb_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Development installs get the UI too, so the suite covers it.
    "streamlit>=1.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoxgb_agent"]
